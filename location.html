<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Us | Holla Bells</title>
    <link rel="icon" href="images/companyLogo.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="theme.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://kit.fontawesome.com/9e22de27e5.js" crossorigin="anonymous"></script>
</head>

<body>

    <!-- ===== Sidebar Navigation ===== -->
    <nav class="navbar navbar-expand-md topbar fixed-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html"><img src="images/companyLogo.png" alt="" width="34" height="34" style="border-radius:8px">Holla Bells</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#topnav" aria-controls="topnav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="topnav">
                <ul class="navbar-nav ms-auto align-items-md-center gap-md-2">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="gallery.html">Menu</a></li>
                    <li class="nav-item"><a class="nav-link" href="location.html">Find us</a></li>
                    <li class="nav-item"><a class="btn btn-gold btn-sm ms-md-2 px-3" href="checkout.html"><i class="fa-solid fa-basket-shopping"></i> Cart <span class="badge cart-badge" id="cart-count">0</span></a></li>
                </ul>
            </div>
        </div>
    </nav>
    <!-- ===== End Sidebar ===== -->

    <!-- ===== Contact & Map Section ===== -->
    <section class="container py-5" id="contact">
        <h2 class="text-center mb-5">Contact Us</h2>

        <div class="row g-4">

            <!-- Contact form -->
            <div class="col-lg-6">
                <form action="https://formsubmit.co/elsi.gatus.sjc@phinmaed.com" method="POST">
                    <input type="hidden" name="_subject" value="New message from the Holla Bells website">
                    <div class="mb-3">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" class="form-control" id="name" name="name" required placeholder="Your name">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required placeholder="your@email.com">
                    </div>
                    <div class="mb-3">
                        <label for="message" class="form-label">Message</label>
                        <textarea class="form-control" id="message" name="message" required rows="5"
                                  placeholder="Write your message here…"></textarea>
                    </div>
                    <button type="submit" class="btn btn-custom">Send Message</button>
                </form>
            </div>

            <!-- Embedded OpenStreetMap showing restaurant location -->
            <div class="col-lg-6">
                <div class="ratio ratio-4x3">
                    <iframe
                        src="https://www.openstreetmap.org/export/embed.html?bbox=120.98805427551271%2C14.61471777608204%2C120.99052190780641%2C14.616573496764607&layer=mapnik&marker=14.615645638382501%2C120.98928809165955"
                        width="100%" height="100%"
                        style="border:0;"
                        allowfullscreen
                        loading="lazy">
                    </iframe>
                </div>
            </div>

        </div><!-- end row -->

        <!-- Contact info strip — uses Bootstrap Icons (bi bi-*) -->
        <div class="row text-center mt-5 gy-4">
            <div class="col-md-3 col-6">
                <i class="bi bi-telephone-fill fs-4 contact-icon"></i>
                <p class="mb-0">+63 912-345-6789</p>
            </div>
            <div class="col-md-3 col-6">
                <i class="bi bi-envelope-fill fs-4 contact-icon"></i>
                <p class="mb-0">info@hollabells.com</p>
            </div>
            <div class="col-md-3 col-6">
                <i class="bi bi-instagram fs-4 contact-icon"></i>
                <p class="mb-0">@hollabells</p>
            </div>
            <div class="col-md-3 col-6">
                <i class="bi bi-facebook fs-4 contact-icon"></i>
                <p class="mb-0">Holla Bells</p>
            </div>
        </div>

    </section>
    <!-- ===== End Contact Section ===== -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
